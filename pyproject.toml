[project]
name = "jamlquantconnect"
version = "0.1.0"
description = "AMMRO — Adaptive Multi-Factor Momentum with Risk Overlay (QuantConnect/LEAN)"
requires-python = "==3.11.*"

dependencies = [
    # Core numerical / data
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11",
    # Backtesting utilities (local testing outside LEAN)
    "quantstats>=0.0.62",
    # Technical indicators (matches LEAN's indicator library for local prototyping)
    "ta-lib-easy",          # TA-Lib wrapper without C-build hassle
    # Plotting / analysis
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Data fetching (for local prototyping & research)
    "yfinance>=0.2.36",
    # Utilities
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "tqdm>=4.66",
    "mt5linux>=1.0.3",
    "schedule>=1.2.2",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",           # fast linter + formatter
    "mypy>=1.10",
    "ipykernel>=6.29",     # Jupyter support for research notebooks
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "stubs"
ignore_missing_imports = true    # AlgorithmImports resolves via stubs/

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
